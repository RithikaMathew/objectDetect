<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<rect width="100%" height="100%" fill="#f7faf8"/>
<text x="20" y="28" font-family="sans-serif" font-size="18" font-weight="bold">Pedestrian event surrogate times</text>
